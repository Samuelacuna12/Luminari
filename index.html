function submitRecord(e,type){e.preventDefault();let v=Object.fromEntries(new FormData(e.target).entries());if(!Object.values(v).some(x=>x.trim()))return alert('Ingresa los datos del registro.');if(editing){db[type]=db[type].map(x=>x.id===editing?{...x,...v}:x)}else db[type].unshift({id:uid(),...v});save();closeModal();render()}
function del(type,id){if(!confirm('¿Eliminar este registro? Esta acción no se puede deshacer.'))return;db[type]=db[type].filter(x=>x.id!==id);save();render()}
function rows(type,cols){let data=db[type].filter(x=>Object.values(x).join(' ').toLowerCase().includes(search.toLowerCase()));let content=data.map(x=>'<tr>'+cols.map(([k,label,fmt])=>'<td>'+(fmt==='money'?'<b>'+money(x[k])+'</b>':fmt==='badge'?badge(x[k]):esc(x[k]||'—'))+'</td>').join('')+'<td><div class="twoaction"><button onclick="formEdit(\''+type+'\',\''+x.id+'\')">Editar</button><button onclick="del(\''+type+'\',\''+x.id+'\')" style="color:#bb5861;background:#ffeff1">Borrar</button></div></td></tr>').join('');return '<div class="panel tablewrap">'+(content?'<table class="tbl"><thead><tr>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'<th>Acciones</th></tr></thead><tbody>'+content+'</tbody></table>':'<div class="empty"><i>◇</i>No hay registros que coincidan. Crea el primero para comenzar.</div>')+'</div>'}
const colsets={
clients:[['name','Nombre'],['phone','Teléfono'],['city','Ciudad'],['type','Tipo'],['email','Correo']],
orders:[['code','Pedido'],['client','Cliente'],['product','Lámpara'],['amount','Venta','money'],['paid','Abonado','money'],['due','Entrega'],['status','Etapa','badge']],
inventory:[['name','Material'],['category','Categoría'],['stock','Disponible'],['min','Mínimo'],['cost','Costo unidad','money'],['supplier','Proveedor']],
transactions:[['date','Fecha'],['type','Tipo','badge'],['category','Concepto'],['client','Cliente / proveedor'],['amount','Valor','money']],
expenses:[['name','Concepto'],['category','Categoría'],['supplier','Proveedor'],['amount','Mensual','money'],['day','Vence día'],['status','Estado','badge']],
tasks:[['name','Tarea'],['related','Relacionado'],['owner','Responsable'],['due','Vence'],['priority','Prioridad','badge'],['status','Estado','badge']],
shipments:[['order','Pedido'],['client','Cliente'],['kind','Tipo'],['carrier','Transportadora'],['tracking','Guía'],['date','Fecha'],['status','Estado','badge']]
};
function toolbar(type){return '<div class="toolbar"><input type="search" placeholder="Buscar en '+specs[type].name.toLowerCase()+'s..." value="'+esc(search)+'" oninput="search=this.value; document.getElementById(\'records\').innerHTML=rows(\''+type+'\',colsets.'+type+');"><div>'+btn('+ Nuevo registro',"formEdit('"+type+"',null)")+'</div></div><div id="records">'+rows(type,colsets[type])+'</div>'}
function fin(){const t=db.transactions,inc=sum(t.filter(x=>x.type==='Ingreso'),x=>x.amount),out=sum(t.filter(x=>x.type==='Egreso'),x=>x.amount),debt=sum(db.orders.filter(x=>x.status!=='Histórico sin validar'),x=>Math.max(0,(+x.amount||0)-(+x.paid||0)));return {inc,out,balance:inc-out,debt,sales:sum(db.orders.filter(x=>x.status!=='Cancelado'),x=>x.amount),cost:sum(db.orders.filter(x=>x.status!=='Cancelado'),x=>x.cost)}}
function cards(arr){return '<div class="grid metrics">'+arr.map(x=>'<div class="panel metric"><span class="label">'+x[0]+'</span><strong>'+x[1]+'</strong><small>'+x[2]+'</small></div>').join('')+'</div>'}
function dashboard(){let f=fin(),delays=db.orders.filter(x=>x.due&&x.due<now()&&!['Entregado','Cancelado'].includes(x.status)),pending=db.tasks.filter(x=>x.status!=='Terminada'),low=db.inventory.filter(x=>(+x.stock||0)<=(+x.min||0));let months=Array.from({length:6},(_,i)=>{let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-5+i);return d.toISOString().slice(0,7)}),vals=months.map(m=>sum(db.orders.filter(x=>String(x.date||'').startsWith(m)&&x.status!=='Cancelado'),x=>x.amount)),max=Math.max(...vals,1);return '<section class="hero"><div><div class="eyebrow" style="color:#84d1ff">CENTRO DE OPERACIONES</div><h2>Tu negocio, en perfecta sincronía.</h2><p>Cada venta, cada diseño, cada detalle. Todo bajo control.</p></div><div class="heroart">✧</div></section>'+cards([['Ventas registradas',money(f.sales),'Pedidos confirmados y activos'],['Recaudo registrado',money(f.inc),'Movimientos de ingreso'],['Cartera de pedidos',money(f.debt),'Saldo pendiente según abonos'],['Utilidad bruta estimada',money(f.sales-f.cost),'Ventas menos costos estimados']])+'<div class="grid twocol"><section class="panel"><div class="section-title">Tendencia de ventas <small>Últimos 6 meses</small></div><div class="bars">'+vals.map((v,i)=>'<div class="barcol"><span class="muted">'+(v?money(v):'')+'</span><div class="bar" style="height:'+Math.max(2,v/max*135)+'px"></div><span>'+months[i].slice(5)+'</span></div>').join('')+'</div><p class="chartlegend">Valores calculados a partir de fechas y montos de pedidos.</p></section><section class="panel"><div class="section-title">Meta comercial mensual</div><div class="muted" style="font-size:12px">Meta de ventas</div><div style="display:flex;align-items:center;gap:9px;margin-top:10px"><input class="goalinput" id="goal" type="number" value="'+db.goal+'" min="1">'+btn('Actualizar','updateGoal()','small')+'</div><h2 style="font-family:Outfit;margin:22px 0 3px">'+money(sum(db.orders.filter(x=>String(x.date||'').startsWith(now().slice(0,7))&&x.status!=='Cancelado'),x=>x.amount))+'</h2><div class="muted" style="font-size:12px">Vendido durante el mes</div><div class="progress"><div style="width:'+Math.min(100,100*sum(db.orders.filter(x=>String(x.date||'').startsWith(now().slice(0,7))&&x.status!=='Cancelado'),x=>x.amount)/(db.goal||1))+'%"></div></div><div class="muted" style="font-size:12px">Proyección lineal: '+money(sum(db.orders.filter(x=>String(x.date||'').startsWith(now().slice(0,7))&&x.status!=='Cancelado'),x=>x.amount)/new Date().getDate()*new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate())+'</div></section></div><div class="grid twocol" style="margin-top:18px"><section class="panel"><div class="section-title">Alertas operativas</div>'+[['Pedidos con entrega vencida',delays.length],['Materiales por debajo del mínimo',low.length],['Tareas sin finalizar',pending.length],['Cotizaciones pendientes',db.quotes.filter(x=>x.status==='Pendiente').length]].map(z=>'<div class="statrow">'+z[0]+badge(String(z[1]))+'</div>').join('')+'</section><section class="panel"><div class="section-title">Acciones rápidas</div><div class="stack">'+btn('＋ Crear cotización','quoteEdit(null)')+btn('＋ Registrar cliente',"formEdit('clients',null)",'light')+btn('＋ Crear pedido',"formEdit('orders',null)",'light')+btn('＋ Registrar movimiento',"formEdit('transactions',null)",'light')+'</div></section></div>'}
function updateGoal(){db.goal=+document.getElementById('goal').value||1;save();render()}
function quoteEdit(id){editing=id;let q=db.quotes.find(x=>x.id===id)||{},items=q.items||[{description:'',qty:1,price:0}];showModal((id?'Editar':'Nueva')+' cotización','<form id="quoteForm" onsubmit="quoteSave(event)"><div class="formgrid">'+field('number','Número de cotización','text',q.number||'COT-'+String(Date.now()).slice(-6))+field('client','Cliente','text',q.client)+field('phone','Teléfono','text',q.phone)+field('date','Fecha','date',q.date||now())+field('valid','Válida hasta','date',q.valid)+field('status','Estado','select',q.status||'Pendiente',['Pendiente','Aprobada','Rechazada'])+field('notes','Condiciones / tiempo de entrega','textarea',q.notes)+'</div><h4>Ítems cotizados</h4><div id="quoteItems">'+items.map((x,i)=>itemHTML(x,i)).join('')+'</div>'+btn('＋ Agregar producto','addItem()','light small')+'<div style="text-align:right;margin-top:18px;font-weight:800">Total: <span id="quoteTotal">0</span></div></form>',btn('Cancelar','closeModal()','light')+btn('Guardar cotización',"document.getElementById('quoteForm').requestSubmit()"));recalc()}
function itemHTML(x,i){return '<div class="quote-row"><input aria-label="Descripción" placeholder="Diseño / descripción" class="qd" value="'+esc(x.description)+'" oninput="recalc()"><input aria-label="Cantidad" type="number" min="1" class="qq" value="'+esc(x.qty)+'" oninput="recalc()"><input aria-label="Precio" type="number" min="0" class="qp" value="'+esc(x.price)+'" oninput="recalc()"><button type="button" onclick="this.parentElement.remove();recalc()">×</button></div>'}
function addItem(){document.getElementById('quoteItems').insertAdjacentHTML('beforeend',itemHTML({description:'',qty:1,price:0},0));recalc()}
function quoteItems(){return [...document.querySelectorAll('.quote-row')].map(x=>({description:x.querySelector('.qd').value,qty:+x.querySelector('.qq').value||0,price:+x.querySelector('.qp').value||0}))}
function recalc(){document.getElementById('quoteTotal').textContent=money(sum(quoteItems(),x=>x.qty*x.price))}
function quoteSave(e){e.preventDefault();let v=Object.fromEntries(new FormData(e.target).entries());v.items=quoteItems();v.amount=sum(v.items,x=>x.qty*x.price);if(!v.client.trim()||!v.items.some(x=>x.description.trim()))return alert('Indica el cliente y al menos un producto.');if(editing)db.quotes=db.quotes.map(x=>x.id===editing?{...x,...v}:x);else db.quotes.unshift({id:uid(),...v});save();closeModal();render()}
function quotePrint(id){let q=db.quotes.find(x=>x.id===id);if(!q)return;let w=window.open('','_blank');if(!w)return alert('Habilita las ventanas emergentes para imprimir.');let content='<html><head><title>Cotización '+esc(q.number)+'</title><style>body{font:14px Arial;color:#1a344f;padding:38px}h1{letter-spacing:5px}table{border-collapse:collapse;width:100%;margin:25px 0}th,td{text-align:left;padding:13px;border-bottom:1px solid #dbe6ef}th{background:#eef4f8}.total{text-align:right;font-size:24px;font-weight:bold}p{line-height:1.6}</style></head><body><h1>LUMINARI</h1><p>ILUMINACIÓN Y DISEÑO</p><hr><h2>COTIZACIÓN '+esc(q.number)+'</h2><p><b>Cliente:</b> '+esc(q.client)+'<br><b>Teléfono:</b> '+esc(q.phone)+'<br><b>Fecha:</b> '+esc(q.date)+'<br><b>Válida hasta:</b> '+esc(q.valid)+'</p><table><tr><th>Diseño / descripción</th><th>Cantidad</th><th>Precio</th><th>Subtotal</th></tr>'+q.items.map(i=>'<tr><td>'+esc(i.description)+'</td><td>'+esc(i.qty)+'</td><td>'+money(i.price)+'</td><td>'+money(i.qty*i.price)+'</td></tr>').join('')+'</table><div class="total">TOTAL: '+money(q.amount)+'</div><h3>Condiciones</h3><p>'+esc(q.notes||'Condiciones sujetas a confirmación.')+'</p><p style="margin-top:70px;color:#8aa0b5">LUMINARI · Documento comercial</p></body></html>';w.document.write(content);w.document.close();w.focus();setTimeout(()=>w.print(),350)}
function quotes(){let filtered=db.quotes.filter(x=>Object.values(x).join(' ').toLowerCase().includes(search.toLowerCase()));return '<div class="toolbar"><input placeholder="Buscar cotizaciones..." oninput="search=this.value;render()" value="'+esc(search)+'">'+btn('＋ Nueva cotización','quoteEdit(null)')+'</div><div class="panel tablewrap">'+(filtered.length?'<table class="tbl"><thead><tr><th>Número</th><th>Cliente</th><th>Fecha</th><th>Total</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>'+filtered.map(q=>'<tr><td><b>'+esc(q.number)+'</b></td><td>'+esc(q.client)+'</td><td>'+esc(q.date)+'</td><td><b>'+money(q.amount)+'</b></td><td>'+badge(q.status)+'</td><td><div class="twoaction"><button onclick="quoteEdit(\''+q.id+'\')">Editar</button><button onclick="quotePrint(\''+q.id+'\')">Imprimir / PDF</button><button style="color:#bc5161" onclick="del(\'quotes\',\''+q.id+'\')">Borrar</button></div></td></tr>').join('')+'</tbody></table>':'<div class="empty"><i>▤</i>Aún no hay cotizaciones.</div>')+'</div>'}
function finances(){let f=fin();return '<div class="grid finance-cards">'+[['Ingresos registrados',money(f.inc)],['Egresos registrados',money(f.out)],['Saldo por movimientos',money(f.balance)]].map(z=>'<div class="panel"><span class="muted">'+z[0]+'</span><strong>'+z[1]+'</strong></div>').join('')+'</div>'+toolbar('transactions')}
function monthlyHistory(){let keys=[...new Set([...db.orders.map(x=>(x.date||'').slice(0,7)),...db.transactions.map(x=>(x.date||'').slice(0,7))])].filter(x=>/^\d{4}-\d{2}$/.test(x)).sort().reverse();if(!keys.length)return '';return '<section class="panel" style="margin-bottom:20px"><div class="section-title">Histórico mensual de operación <small>Importaciones y registros</small></div><div class="tablewrap"><table class="tbl"><thead><tr><th>Mes</th><th>Registros de venta</th><th>Valor de ventas registradas</th><th>Gastos registrados</th><th>Diferencia simple</th></tr></thead><tbody>'+keys.map(m=>{let o=db.orders.filter(x=>(x.date||'').startsWith(m)),v=sum(o,x=>x.amount),g=sum(db.transactions.filter(x=>(x.date||'').startsWith(m)&&x.type==='Egreso'),x=>x.amount);return '<tr><td><b>'+m+'</b></td><td>'+o.length+'</td><td>'+money(v)+'</td><td>'+money(g)+'</td><td>'+money(v-g)+'</td></tr>'}).join('')+'</tbody></table></div><p class="chartlegend">La diferencia de ventas menos gastos no es utilidad contable. Los datos históricos pueden incluir cotizaciones y movimientos pendientes de clasificación.</p></section>'}
function reports(){let f=fin(),ds=[['Ventas en pedidos',f.sales],['Costo previsto de pedidos',f.cost],['Margen bruto estimado',f.sales-f.cost],['Ingresos de caja',f.inc],['Egresos de caja',f.out],['Saldo de caja registrado',f.balance],['Saldo por cobrar verificado',f.debt],['Compromisos fijos mensuales',sum(db.expenses,x=>x.amount)]];return '<div class="toolbar">'+btn('Exportar reporte CSV','exportCSV()')+btn('Copia de seguridad JSON','backup()','light')+btn('Restaurar copia JSON','document.getElementById(\'restore\').click()','light')+'<input id="restore" type="file" accept=".json" style="display:none" onchange="restoreFile(event)"></div><div class="notice">Los indicadores de ventas, caja y cartera se calculan de fuentes diferentes. No se suman entre sí. Esta versión registra datos en el dispositivo actual; exporta copias periódicas.</div><div class="panel"><div class="section-title">Resumen ejecutivo</div>'+ds.map(z=>'<div class="statrow"><span>'+z[0]+'</span><strong>'+money(z[1])+'</strong></div>').join('')+'</div>'+monthlyHistory()+'<div class="grid metrics">'+[['Clientes',db.clients.length,'En CRM'],['Pedidos',db.orders.length,'Registrados'],['Cotizaciones',db.quotes.length,'Emitidas'],['Entregas / garantías',db.shipments.length,'Registros']].map(x=>'<div class="panel metric"><span class="label">'+x[0]+'</span><strong>'+x[1]+'</strong><small>'+x[2]+'</small></div>').join('')+'</div>'}
function exportCSV(){let lines=[['Indicador','Valor'],['Ventas',fin().sales],['Costos',fin().cost],['Ingresos',fin().inc],['Egresos',fin().out],['Cartera',fin().debt]];download('luminari-reporte.csv','\uFEFF'+lines.map(x=>x.join(';')).join('\n'),'text/csv')}
function download(n,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function backup(){download('luminari-respaldo-'+now()+'.json',JSON.stringify(db,null,2),'application/json')}
function restoreFile(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let v=JSON.parse(reader.result);if(!['clients','orders','quotes','transactions'].every(x=>Array.isArray(v[x])))throw Error('Formato inválido');if(!confirm('Se reemplazarán todos los datos actuales. ¿Continuar?'))return;db={...blank(),...v};save();render()}catch{alert('El archivo no corresponde a un respaldo válido de LUMINARI.')}};reader.readAsText(f)}
function render(){let m=menu.find(x=>x[0]===page);document.getElementById('title').textContent=m[2];document.getElementById('subtitle').textContent=page==='dashboard'?'Visión general de tu empresa':'Centro de operaciones';document.getElementById('today').textContent=new Date().toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'});document.getElementById('nav').innerHTML=menu.map(x=>'<button class="'+(page===x[0]?'active':'')+'" onclick="go(\''+x[0]+'\')"><span>'+x[1]+'</span>'+x[2]+'</button>').join('');document.getElementById('main').innerHTML=(page==='dashboard'?dashboard():page==='quotes'?quotes():page==='reports'?reports():page==='transactions'?finances():toolbar(page))+'<div class="footer">LUMINARI STUDIO · Control privado · Datos en Supabase.</div>'}
function go(p){page=p;search='';document.getElementById('sidebar').classList.remove('open');render()}
render();
if(IS_DEMO){document.body.classList.add("authorized");document.body.insertAdjacentHTML("afterbegin",'<div class="demo-ribbon">VISTA PREVIA · Datos de ejemplo <a href="./">Ir al acceso privado ↗</a></div>')}
</script><script src="./studio-ui.js?v=3.2"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="./cloud.js"></script></body></html>
